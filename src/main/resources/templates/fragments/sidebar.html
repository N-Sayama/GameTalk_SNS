<!-- templates/fragments/sidebar.html -->
<div th:fragment="menu" class="sidebar">
  <ul>
    <li><a th:href="@{/gametalk/posts}">🏠 ホーム</a></li>
    <li><a th:href="@{/gametalk/create}">➕ 新規投稿</a></li>
    <li><a th:href="@{/gametalk/chat}">💬 チャット</a></li>
    <li><a th:href="@{/gametalk/profile/search-page}">🔍 検索</a></li>
    <li><a th:href="@{/gametalk/profile/}" sec:authorize="isAuthenticated()">⚫ プロフィール</a></li>
  </ul>

  <!-- ログイン中だけ表示 -->
  <form sec:authorize="isAuthenticated()"
        th:action="@{/logout}" method="post"
        style="position: absolute; bottom: 20px; left: 10px; right: 10px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" style="
      background-color: #e74c3c; color: white; border: none;
      padding: 10px 12px; border-radius: 4px; cursor: pointer; width: 100%;
    ">
      🔓 ログアウト
    </button>
  </form>
</div>
