<!DOCTYPE html>
<!--/*
	thから始まる属性はHTMLの仕様では許可されていない。
	そのため、htmlタグにxmlns:th属性を追加して、IDLが警告を出さないようにしている。
 */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>ログイン</title>
	<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
	<div class="auth-wrap">
	    <div class="auth-card">
			
			<div class="brand">GameTalk</div>
			<h1 class="auth-form">ログイン</h1>
	<!--/* ログインエラーがある場合はエラー内容を表示する。 */-->
	<span th:if="${param.error}" style="color: red;">ユーザ名またはパスワードが間違っています</span>
	<!--/* ログインボタンをクリックした際に /login に対してPOSTメソッドでHTTPリクエストするためのフォーム。 */-->
	
	<form method="post" th:action="@{/login}">
		<div class="field">
			<label class="label" for="username">ユーザー名</label>
			<input class="class" id="username" type="text" name="username" placeholder="ユーザー名"/>
		</div>

		<div class="field">
			<label class="label" for="password">パスワード</label>
			<input class="input" id="password" type="password" name="password" placeholder="パスワード"/>
		</div>
		
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<button class="btn btn-primary" type="submit">ログイン</button>
		
		<p class="note">
		       アカウントをお持ちでないですか？
		       <a class="link" th:href="@{/signin}">登録する</a>
			</div>
		</div>
			   
	</form>
</body>
</html>
