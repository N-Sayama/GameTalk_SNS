<!-- templates/chat/user-list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チャット相手を選択</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="container">
        <div th:replace="~{fragments/sidebar :: menu}"></div>
        <div class="main-content">
            <h1>チャットする相手を選択</h1>
			
			<p class="chat-description">フォローした相手とチャットできる</p>
			<ul>
			  <li th:each="user : ${users}">
			    <a th:href="@{'/gametalk/chat/' + ${user.username}}"
			       th:text="${user.username}">username</a>
			  </li>
			</ul>

        </div>
    </div>
</body>
</html>
