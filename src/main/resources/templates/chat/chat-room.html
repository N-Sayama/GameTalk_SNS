<!-- templates/chat/chat-room.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チャットルーム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="container">
        <div th:replace="~{fragments/sidebar :: menu}"></div>
        <div class="main-content">
            <h1 th:text="'チャット相手: ' + ${otherUser.username}"></h1>

			<!-- メッセージ一覧（本実装） -->
			<div class="chat-messages">
			    <div th:each="message : ${messages}">
			        <p>
			            <strong th:text="${message.sender}">送信者</strong>:
			            <span th:text="${message.content}">メッセージ内容</span>
			            <span th:text="${#temporals.format(message.timestamp, 'HH:mm')}">時間</span>
			        </p>
			    </div>
			</div>


            <!-- メッセージ送信フォーム（後で実装） -->
            <form th:action="@{/gametalk/chat/send}" method="post">
                <input type="hidden" name="toUsername" th:value="${otherUser.username}" />
                <textarea name="content" rows="3" placeholder="メッセージを入力"></textarea>
                <br>
                <button type="submit">送信</button>
            </form>
        </div>
    </div>
</body>
</html>
